name: AgentPR Bot Handler

on:
  schedule:
    # Poll Telegram every 15 minutes for commands
    - cron: "*/15 * * * *"
  workflow_dispatch:

# Prevent two bot runs overlapping (avoids duplicate responses)
concurrency:
  group: bot-handler
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot handler
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: python bot_handler.py

      - name: Commit updated bot_offset.json
        run: |
          git config user.name "AgentPR Bot"
          git config user.email "agentpr@users.noreply.github.com"
          git add bot_offset.json
          git diff --cached --quiet || git commit -m "chore: update bot_offset [skip ci]"
          git push
